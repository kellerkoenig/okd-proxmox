# Built-in defaults. cluster.yaml is deep-merged on top of this file (maps are
# merged key by key, lists replace the default list). Do not edit this file to
# configure a cluster; set the value in cluster.yaml instead.

okd:
  version: ""
  release_image: ""

install:
  pull_secret_file: ""
  ssh_public_key_file: ""
  # More SSH keys for the core user. Only the first key of all goes into
  # install-config sshKey (several keys there break Metal3/Ironic on
  # baremetal); the rest are rolled out as Pre-Boot MachineConfigs.
  additional_ssh_keys: []
  # The agent ISO embeds certificates that expire after 24h. While no VM has
  # booted it, create rebuilds an ISO older than this.
  iso_max_age_hours: 20
  # Reset a VM once when the agent installer gave up on it (stage timeout)
  # and it stays in the live ISO with its disk already written, then approve
  # its CSRs (see README, Troubleshooting).
  recover_stuck_hosts: true
  # Debugging only: the agent ISO (and node add ISOs) start a root shell
  # without password on tty9, reachable from the Proxmox console, while a
  # node runs from the ISO. Installed nodes are not affected.
  debug_shell: false

proxmox:
  nodes: []
  spread: true
  vm_storage: local-lvm
  iso_storage: local
  efi_storage: ""
  bridge: vmbr0
  vlan_tag: 0
  pool: ""
  vmid_start: 0
  vmid_end: 0
  vmid_block: 20
  mac_prefix: "02:00:00"
  cpu_type: host
  bios: ovmf
  machine: q35
  # Local directories on the machine that runs okd-pve. Relative paths are
  # relative to the cluster directory. tmp_dir becomes TMPDIR (ISO upload
  # buffer, downloads, openshift-install), cache_dir XDG_CACHE_HOME
  # (openshift-install base ISO, OpenTofu providers). "" = $TMPDIR or /tmp,
  # $XDG_CACHE_HOME or ~/.cache.
  tmp_dir: ""
  cache_dir: ""
  host_memory_reserve_gib: 8
  root_device_hint: serial
  # Seconds for an ISO upload. The provider stops every upload after 20
  # minutes anyway, so values above 1200 have no effect.
  upload_timeout: 3600
  # Proxmox tags on the VMs. Off by default: when tags are set at creation,
  # Proxmox checks VM.Config.Options on /vms/<vmid> and ignores pool ACLs.
  tags: false
  # QEMU guest agent: Proxmox shows the IPs, shuts nodes down cleanly and
  # freezes the file systems for snapshot backups. SCOS ships and starts the
  # agent; existing VMs pick the change up after a power cycle in Proxmox.
  guest_agent: true
  # Proxmox HA: every VM becomes an HA resource (state started), so the HA
  # manager restarts it on another node when its node fails. Needs shared
  # VM storage, a quorate Proxmox cluster after a node failure (two nodes
  # need a QDevice) and Sys.Audit + Sys.Console for the token on "/"
  # (no propagation needed). See docs/proxmox-permissions.md.
  ha:
    enabled: false
    max_restart: 1
    max_relocate: 1

network:
  interface: ens18
  prefix_length: 24
  gateway: ""
  dns_servers: []
  ntp_servers: []
  rendezvous_ip: ""

# Hostname = Kubernetes node name = Proxmox VM name. Placeholders: {cluster},
# {group}, {index}, {domain} (baseDomain). Must contain {group} and {index}.
hostname_format: "{cluster}-{group}-{index}"

node_groups: []

infra:
  taint_key: node-role.kubernetes.io/infra
  taint_value: reserved
  taint_effects: [NoSchedule]
  combined_min_memory_gib: 48

kubelet:
  pools: [master, worker]
  auto_sizing_reserved: true
  image_gc_high_threshold_percent: 80
  image_gc_low_threshold_percent: 70
  image_minimum_gc_age: 5m
  eviction_soft_grace_period: 1m30s
  eviction_pressure_transition_period: 5m
  eviction_hard:
    memory.available: 500Mi
    nodefs.available: 10%
    nodefs.inodesFree: 5%
    imagefs.available: 15%
    imagefs.inodesFree: 10%
  eviction_soft:
    memory.available: 1Gi
    nodefs.available: 15%
    nodefs.inodesFree: 10%
    imagefs.available: 20%
    imagefs.inodesFree: 15%

preboot:
  chrony: true
  kubelet: true
  chrony_overrides:
    master: []
    worker: []
    infra: []
  kernel_args:
    master: ["console=tty0", "console=ttyS0,115200n8"]
    worker: ["console=tty0", "console=ttyS0,115200n8"]
    infra: []
  ca_bundle_file: ""

storage:
  backend: none
  storage_class: okd-pve
  retain_class: true
  default: false
  test: true
  test_image: registry.access.redhat.com/ubi9/ubi-minimal:latest
  proxmox_csi:
    version: v0.21.0
    region: ""
    storage: ""
    fstype: xfs
    cache: none
    ssd: true
  ceph:
    version: v3.18.1
    cluster_id: ""
    monitors: []
    pool: ""
    user: ""
    fstype: xfs
  lso:
    node_groups: []
    volume_mode: Filesystem
    fstype: xfs
    odf: false
  nfs:
    server: ""
    path: ""
    image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
    archive_on_delete: true

# Registry mirrors: pull-through caches (Artifactory/Nexus remote repositories,
# Harbor proxy projects). Empty list = pull directly from the sources. See
# docs/registry-mirrors.md.
registry_mirrors:
  # false: the nodes pull only from the mirror (NeverContactSource), images
  # the mirror cannot deliver fail. true: fall back to the source. Can be
  # set per entry as well.
  fallback: false
  # Credentials for the mirrors, merged into the pull secret; empty for
  # anonymous mirrors. username/password apply to every mirror (an entry can
  # set its own); $OKD_PVE_MIRROR_PASSWORD overrides password. auth_file: an
  # auth.json from 'podman login --authfile' instead or in addition.
  username: ""
  password: ""
  auth_file: ""
  # - {source: quay.io, mirror: quay-cache.example.com}
  registries: []

monitoring:
  storage_class: ""

hooks:
  dir: ""
  builtin: []
  skip: []
  timeout: 3600
  env: {}

verify:
  time_sync: true
  storage_test: true
