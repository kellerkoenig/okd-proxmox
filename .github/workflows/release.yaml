#
# On a pushed tag vX.Y.Z: run all checks, verify the tag matches
# OKD_PVE_VERSION, build a source tarball with SHA256SUMS and build
# provenance, and attach them to the GitHub release. An existing release
# (with your own notes) only gets the assets; otherwise a draft release with
# generated notes is created for you to edit and publish.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: checks, tarball, release assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches OKD_PVE_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=$(sed -n 's/^OKD_PVE_VERSION=//p' lib/versions.sh)
          if [[ ${TAG} != "v${ver}" ]]; then
            echo "::error::Tag ${TAG} does not match OKD_PVE_VERSION=${ver} in lib/versions.sh"
            exit 1
          fi

      - name: Install tools
        run: make tools

      - name: All checks
        run: make check

      - name: Source tarball and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver=${TAG#v}
          mkdir dist
          git archive --format=tar.gz --prefix="okd-proxmox-${ver}/" -o "dist/okd-proxmox-${ver}.tar.gz" HEAD
          (cd dist && sha256sum -- *.tar.gz >SHA256SUMS && cat SHA256SUMS)

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/okd-proxmox-*.tar.gz

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" --draft --verify-tag --generate-notes --title "okd-pve ${TAG#v}"
          fi
          gh release upload "${TAG}" dist/* --clobber
