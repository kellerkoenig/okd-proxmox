#
# CodeQL scans the GitHub Actions workflows (script injection, untrusted
# checkouts, excessive permissions); results go to the Security tab. CodeQL
# has no Bash support, shellcheck in the CI workflow covers the scripts.
# OpenSSF Scorecard (SAST) detects this workflow. It needs CodeQL "default
# setup" to be off in the repository settings.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (GitHub Actions)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions
