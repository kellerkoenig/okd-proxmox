#
# Actions are pinned by commit SHA (OpenSSF Scorecard: Pinned-Dependencies);
# Renovate keeps the SHAs and the version comments up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: shellcheck + shfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: make tools
      - name: shellcheck
        run: make lint
      - name: shfmt
        run: make fmt

  test:
    name: bats
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: make tools
      - name: bats
        run: make test

  test-yq-oldest:
    # The oldest yq okd-pve supports (preflight warns below it). yq changes
    # expression semantics between releases: 4.45 silently dropped an
    # assignment that 4.54 applies.
    name: bats (oldest supported yq)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: make tools YQ_VERSION=4.45.4
      - name: bats
        run: make test

  terraform:
    name: tofu validate + tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: make tools
      - name: tofu fmt / validate / tflint
        run: make terraform

  image:
    name: container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f Containerfile --build-arg OKD_PVE_VERSION=ci -t okd-pve:ci .
      - name: Smoke test
        run: |
          docker run --rm okd-pve:ci version
          docker run --rm --entrypoint bash okd-pve:ci -c 'for c in yq jq nmstatectl ssh whiptail column dig setpriv useradd; do command -v "$c" >/dev/null || { echo "missing: $c"; exit 1; }; done'
          # files written to /work belong to the owner of the mounted directory
          mkdir -p work
          docker run --rm -v "$PWD/work:/work" okd-pve:ci init demo
          test "$(stat -c %u work/clusters/demo/cluster.yaml)" = "$(id -u)"

  leakcheck:
    name: no environment-specific data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for real hostnames, IPs, webhooks and tokens
        run: make leakcheck

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every file has copyright and license information
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
